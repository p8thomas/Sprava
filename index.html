<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sprava</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="panel" aria-labelledby="title">
        <p class="eyebrow">Sprava is alive</p>
        <h1 id="title">Your repo now runs.</h1>
        <p class="copy">
          This is a clean starter page served straight from the Sprava folder.
          No build step, no package install, just something real on the screen.
        </p>
        <div class="actions">
          <button id="ping" type="button">Run check</button>
          <span id="result" role="status">Ready.</span>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
